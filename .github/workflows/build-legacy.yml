name: Build Legacy APK (Android 7+)
# Manual only (Actions tab -> "Build Legacy APK (Android 7+)" -> Run workflow).
# Patches a TEMPORARY copy on the runner; the repo files and the normal "Build APK" workflow are untouched.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src/main/rust
      - name: Apply Android 7 compatibility patch (runner only)
        run: python3 .github/legacy/patch_legacy.py
      - name: Build Rust engine for Android (API 24)
        working-directory: app/src/main/rust
        run: |
          cargo install cargo-ndk --locked
          cargo ndk -t arm64-v8a -t armeabi-v7a --platform 24 -o ../jniLibs build --release
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Show build errors
        if: failure()
        run: |
          { grep -E "^e: " build.log | head -30; grep -A5 "What went wrong" build.log | head -14; } > errors.txt || true
          { echo '### Build errors'; echo '```'; cat errors.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          head -10 errors.txt | while IFS= read -r line; do echo "::error::${line}"; done
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/*.apk payesh-legacy.apk
      - uses: actions/upload-artifact@v4
        with:
          name: payesh-legacy-apk
          path: payesh-legacy.apk
      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: payesh-legacy
          name: Payesh legacy (Android 7+)
          prerelease: true
          files: payesh-legacy.apk
